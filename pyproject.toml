[project]
name = "fuiagent"
version = "0.1.0"
description = "Prototype Coding Agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "textual-image>=0.8.4",
]

[project.scripts]
chaldea = "chaldea.tui:main"

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["chaldea*"]
